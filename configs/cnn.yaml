# Settings for the CNN baseline.
# Member: Anika
# Give every training run a new experiment_id so results are not overwritten.

experiment_id: "EXP-004"

# Shared team files.
data_config: "configs/data.yaml"
class_mapping: "config/gesture_classes.json"

# Model shape
model:
  aggregation: "features"      # "features" = average what frames see, then predict once
                               # "predictions" = each frame predicts, then average (EXP-001)
  backbone: "mobilenet"        # "small" = CNN from scratch, "mobilenet" = pretrained MobileNetV2
  filters: [16, 32, 64, 128]   # filters in each CNN block (small backbone only)
  dense_units: 128             # size of the layer before the final prediction
  dropout: 0.3                 # share of values randomly dropped while training

# Training
training:
  learning_rate: 0.0001        # lower for a pretrained encoder, so it keeps what it learned
  epochs: 20
  early_stopping_patience: 6   # stop if validation loss has not improved for this many epochs
  seed: 42

  # Use part of the data to save time on CPU. null = use everything.
  # Example: 6000 trains on the first 6,000 training videos.
  # The split CSVs are already shuffled, so the first rows are a fair sample.
  train_limit: 8000
  validation_limit: null

# Where results go
output_dir: "experiments/cnn_baseline"   # history, curves and run notes 
checkpoint_dir: "checkpoints"            # .keras model files 